# storefront — staging
#
# Owned by the Storefront team. The chart lives in argocd-class-resources; only the
# values that differ per environment belong here.
replicaCount: 2

image:
  repository: hashicorp/http-echo
  # Pinned per environment. Promotion is a one-line change in the environment that is
  # being promoted TO — never a branch merge.
  tag: "1.0"

banner: "storefront v1 — staging"

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi
